services:
  - type: web
    name: grassmapper
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
